<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ด่วนคณิต EXPRESS MATH</title>
<style>
  :root {
    --theme: #0ea5e9;
    --bg: #0b1020;
    --panel: #141b31;
    --text: #eef2ff;
    --dim: #8b93b0;
    --good: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a2342 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #app { max-width: 420px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  section[hidden] { display: none !important; }
  section { flex: 1; display: flex; flex-direction: column; }

  /* ---------- menu ---------- */
  #menu { align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  #menu .logo { font-size: 3rem; line-height: 1; }
  #menu h1 { font-size: 2.6rem; letter-spacing: .02em; }
  #menu .sub { color: var(--dim); letter-spacing: .35em; font-size: .8rem; font-weight: 700; }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    background: var(--panel); color: var(--text);
    border-radius: 16px; padding: 16px 22px; font-size: 1.15rem; font-weight: 700;
    width: min(100%, 300px); font-family: inherit;
    transition: transform .08s ease, background .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--theme); color: #06121f; }
  .btn.big { padding: 20px 22px; font-size: 1.3rem; }
  #menu .hint { color: var(--dim); font-size: .85rem; margin-top: 8px; }
  .statline { display: flex; gap: 16px; color: var(--dim); font-size: .95rem; }
  .statline b { color: var(--text); font-variant-numeric: tabular-nums; }
  #muteBtn { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; padding: 0; font-size: 1.2rem; border-radius: 12px; }

  /* ---------- play ---------- */
  #play { padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  #hud { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #station { font-weight: 700; color: var(--theme); white-space: nowrap; }
  #score { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #streakBadge { color: var(--dim); font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #streakBadge.hot { color: #fb923c; }
  #streakBadge.bump { display: inline-block; animation: pop .45s ease; }
  #multBadge { font-weight: 800; color: var(--theme); font-variant-numeric: tabular-nums; }
  #timebar { height: 10px; border-radius: 6px; background: #1d2742; margin: 10px 0 6px; overflow: hidden; }
  #timefill { height: 100%; width: 100%; background: var(--theme); border-radius: 6px; transition: width .12s linear; }
  #timebar.low #timefill { background: var(--bad); animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
  #qwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #question { font-size: clamp(2.4rem, 12vw, 3.4rem); font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: .01em; }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .choice {
    appearance: none; border: 2px solid #232e4d; cursor: pointer;
    background: var(--panel); color: var(--text);
    border-radius: 18px; min-height: 76px; font-size: 1.9rem; font-weight: 800;
    font-variant-numeric: tabular-nums; font-family: inherit;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .choice:active { transform: scale(.97); }
  .choice.good { background: var(--good); border-color: var(--good); color: #052012; }
  .choice.bad { background: var(--bad); border-color: var(--bad); color: #2b0505; animation: shake .4s; }
  .choice.reveal { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  #float { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-weight: 800; font-size: 1.6rem; pointer-events: none; opacity: 0; }
  #float.pop { animation: floatup .8s ease-out; }
  @keyframes floatup { 0% { opacity: 0; translate: 0 12px; } 25% { opacity: 1; } 100% { opacity: 0; translate: 0 -46px; } }
  #timeDelta { position: absolute; right: 18px; top: 64px; font-weight: 800; font-size: 1.2rem; pointer-events: none; opacity: 0; }
  #timeDelta.pop { animation: floatup .8s ease-out; }
  #timeDelta.plus { color: var(--good); } #timeDelta.minus { color: var(--bad); }

  /* ---------- overlay ---------- */
  #overlay { position: absolute; inset: 0; background: rgba(8, 11, 24, .82); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
  #overlay[hidden] { display: none; }
  #overlay .big { font-size: 4rem; font-weight: 800; }
  #overlay .banner { font-size: 1.5rem; font-weight: 800; color: var(--theme); }
  #overlay .note { color: var(--dim); }

  /* ---------- result ---------- */
  #result { align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  #result .timeup { color: var(--dim); letter-spacing: .25em; font-size: .8rem; font-weight: 700; }
  #finalScore { font-size: 4.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #newBest { background: var(--good); color: #052012; font-weight: 800; border-radius: 999px; padding: 6px 18px; animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  #tier { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; }
  #tier .emoji { font-size: 2.2rem; }
  #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; color: var(--dim); font-size: .95rem; margin: 10px 0 6px; }
  #stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .choice.bad, #float.pop, #timeDelta.pop, #newBest { animation: none; }
    #timebar.low #timefill { animation: none; }
  }
</style>
</head>
<body>
<div id="app">

  <section id="menu">
    <button id="muteBtn" class="btn" aria-label="sound">🔊</button>
    <div class="logo">🚂</div>
    <h1 id="t_title"></h1>
    <div class="sub" id="t_sub"></div>
    <div class="statline" id="menuStats"></div>
    <button id="playBtn" class="btn primary big"></button>
    <button id="dailyBtn" class="btn big"></button>
    <a id="feedbackLink" class="btn" target="_blank" rel="noopener"></a>
    <div class="hint" id="t_hint"></div>
  </section>

  <section id="play" hidden>
    <div id="hud">
      <span id="station"></span>
      <span id="score">0</span>
      <span id="streakBadge"></span>
    </div>
    <div id="timebar"><div id="timefill"></div></div>
    <div id="qwrap"><div id="question"></div></div>
    <div id="choices"></div>
    <div id="float"></div>
    <div id="timeDelta"></div>
    <div id="overlay" hidden></div>
  </section>

  <section id="result" hidden>
    <div class="timeup" id="t_timeup"></div>
    <div id="finalScore">0</div>
    <div id="newBest" hidden></div>
    <div id="tier"></div>
    <div id="stats"></div>
    <button id="againBtn" class="btn primary big"></button>
    <button id="menuBtn" class="btn"></button>
  </section>

</div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="engine.js"></script>
</body>
</html>
