<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EA">
<title>อนุบาล · ด่วนคณิต</title>
<style>
  :root {
    --bg: #FFF6EA; --card: #FFFDF7; --ink: #6B4F3A; --dim: #B08D6E;
    --accent: #FF9F43; --accent-soft: #FFD3A0; --line: #FFE3C2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  #app { max-width: 420px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  section[hidden] { display: none !important; }
  section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  button { font-family: inherit; cursor: pointer; appearance: none; border: 0; color: inherit; }

  /* ---------- hub (S-02): band strip + one scrolling zone board (FEATURES-OQ-D) ---------- */
  #hub { padding: max(14px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); gap: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .iconbtn {
    min-width: 64px; min-height: 64px; border-radius: 20px; background: var(--card);
    border: 3px solid var(--line); font-size: 1.8rem;
    transition: transform .08s ease;
  }
  .iconbtn:active { transform: scale(.95); }
  #bandStrip { display: flex; gap: 10px; }
  .bandBtn {
    flex: 1; min-height: 64px; border-radius: 20px; background: var(--card);
    border: 3px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .bandBtn:active { transform: scale(.96); }
  .bandBtn .bIcon { font-size: 1.6rem; line-height: 1; }
  .bandBtn .bLabel { font-size: .82rem; color: var(--dim); }
  .bandBtn.active { border-color: var(--accent); background: #FFF1DC; }
  .bandBtn.active .bLabel { color: var(--ink); }
  #gameGrid { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding: 4px 2px 10px; }
  .zone { display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; } /* never shrink inside the scrolling board (owner report 2026-09-23: shrunken zones overlapped cards → wrong tap targets) */
  .zoneHead { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .zoneHead .zIcon { font-size: 1.5rem; line-height: 1; }
  .zoneHead .zLabel { font-size: 1rem; font-weight: 700; color: var(--dim); }
  .zoneGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .zoneGrid:has(.gameCard:only-child) { grid-template-columns: 1fr; max-width: 260px; width: 100%; }
  .gameCard {
    min-height: 132px; border-radius: 28px; background: var(--card); border: 3px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s ease;
  }
  .gameCard:active { transform: scale(.96); }
  .gameCard .gIcon { font-size: 3.4rem; line-height: 1; }
  .gameCard .gCaption { font-size: 1.05rem; font-weight: 700; }

  /* ---------- play frame (S-03): content + cartoon overlay ---------- */
  #play { padding: max(14px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
  #content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 0; gap: 22px; overflow-y: auto; }
  #prompt { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 2.6rem; line-height: 1.25; max-width: 100%; margin-top: auto; flex-shrink: 0; } /* auto margins center when it fits, collapse to scroll when tall (no clipped tops) */
  #choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; margin-bottom: auto; flex-shrink: 0; }
  .choice {
    min-height: 84px; border-radius: 24px; background: var(--card); border: 3px solid var(--line);
    font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums;
    transition: transform .08s ease;
  }
  .choice:active { transform: scale(.95); }
  .choice:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .cardFill { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .numeral { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 130px; }
  .dots.big { max-width: 220px; }
  .dots.big .dot { font-size: 1.8rem; }
  .dots.small .dot { font-size: 1.05rem; }
  .qbar { background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 10px 26px; display: flex; align-items: center; gap: 12px; }
  .qbar .qArrow { font-size: 2rem; line-height: 1; }
  .qDots { font-size: 1.5rem; letter-spacing: 3px; color: #E8862E; }
  .qDot { color: #E8862E; }
  .qDot.big { font-size: 2.6rem; }
  .qDot.small { font-size: 1.1rem; }
  #choices.sides { gap: 16px; }
  .choice.side { min-height: 210px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 12px; }
  .sideItem { font-size: 1.9rem; line-height: 1.25; }
  .sampleShape { font-size: 4.6rem; line-height: 1; }
  .patternRow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-size: 2.4rem; max-width: 100%; }
  .patternRow .pItem { line-height: 1.1; }
  .patternRow .qmark { opacity: .5; }
  .gShape { font-size: 2.4rem; line-height: 1; }
  .orderRow { display: flex; gap: 10px; align-items: flex-end; justify-content: center; flex-wrap: wrap; min-height: 110px; }
  .oSlot { min-width: 58px; min-height: 78px; border-radius: 16px; border: 3px dashed var(--line); display: flex; align-items: flex-end; justify-content: center; padding: 4px 8px; color: var(--dim); font-size: 1.5rem; line-height: 1; }
  .oSlot.settled { border-style: solid; background: var(--card); }
  .oItem { line-height: 1; }
  .sortPrompt { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sCur { font-size: 4rem; line-height: 1; }
  .sWaiting { display: flex; gap: 8px; font-size: 1.5rem; opacity: .75; }
  .choice.binBtn { min-height: 200px; flex-direction: column; gap: 8px; }
  .binIcon { font-size: 3rem; line-height: 1; }
  .binLabel { font-size: 1.05rem; font-weight: 700; color: var(--dim); }
  .binItems { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 140px; font-size: 1.35rem; opacity: .85; }

  /* S-12 «เงาใครเอ่ย» — silhouette cards (CSS-filter fallback; art set 1 = T-051 upgrade) */
  .sil { font-size: 3rem; line-height: 1; filter: brightness(0); opacity: .8; }

  /* S-13 «บน–ล่าง–ใน–นอก» — scene stacks + wordless relation pictogram */
  .posWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .posScene { display: flex; align-items: center; justify-content: center; gap: 36px; }
  .posStack { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .posRow { display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 42px; font-size: 2rem; line-height: 1; }
  .posAnchor { font-size: 3.6rem; line-height: 1.1; }
  .posBoxWrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .posIn { position: absolute; font-size: 1.7rem; line-height: 1; }
  .posQ { gap: 12px; padding: 8px 20px; font-size: 1.7rem; }
  .pqDot { width: 15px; height: 15px; border-radius: 50%; background: #E8862E; display: inline-block; }
  .pqStack { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pqBoxWrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .pqIn { position: absolute; }
  .pqRow { display: flex; align-items: center; gap: 8px; }

  /* S-14 «ยาว–สั้น» — common-baseline bars, widths data-scaled */
  .lenGlyph { display: inline-block; height: 14px; border-radius: 999px; background: #E8862E; }
  .lenGlyph.long { width: 88px; }
  .lenGlyph.short { width: 26px; }
  #choices.lenRows { display: flex; flex-direction: column; gap: 12px; }
  .choice.lenRow { min-height: 64px; display: flex; align-items: center; justify-content: flex-start; padding: 6px 22px; }
  .lenBar { display: inline-block; height: 30px; border-radius: 999px; background: linear-gradient(180deg, #FFC98A, #FF9F43); }

  /* S-17 «ครึ่ง–เต็ม» — half prompt via clip-path (art set 3 = T-053 upgrade) */
  .halfImg { display: inline-block; }
  .halfImg.cut-v { clip-path: inset(0 50% 0 0); }
  .halfImg.cut-h { clip-path: inset(0 0 50% 0); }
  .halfImg.cut-d { clip-path: polygon(0 0, 100% 0, 0 100%); }

  /* S-16 «เท่ากันไหม» — sample plate + «=» + choice plates (one kind per plate) */
  .eqWrap { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .eqSign { font-size: 3.2rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .plate { border-radius: 24px; background: var(--card); border: 3px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; }
  .plate.eqSample { min-width: 150px; min-height: 120px; padding: 12px 16px; font-size: 1.9rem; }
  .plate.eqSample .plateItem { font-size: 1.9rem; line-height: 1.2; }
  .choice.plate { min-height: 108px; padding: 10px 12px; }
  .choice.plate .plateItem { font-size: 1.5rem; line-height: 1.2; }

  #overlay {
    position: absolute; inset: 0; background: rgba(255, 246, 234, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 10;
  }
  #overlay[hidden] { display: none; }
  .handoff { display: flex; align-items: center; gap: 12px; background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 10px 22px; font-size: 1.6rem; }
  .handoff .hLabel { font-size: 1rem; color: var(--dim); }
  .turnBadge { min-width: 64px; min-height: 64px; border-radius: 20px; background: var(--card); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
  #chooserBody { flex: 1; display: flex; gap: 16px; align-items: stretch; justify-content: center; padding: 8px 0 4px; }
  .chooseBtn {
    flex: 1; max-width: 180px; min-height: 180px; border-radius: 28px; background: var(--card); border: 3px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: transform .08s ease;
  }
  .chooseBtn:active { transform: scale(.96); }
  .chooseBtn .cIcon { font-size: 3.4rem; }
  .chooseBtn .cLabel { font-size: 1.05rem; font-weight: 700; }
  .art { width: min(64vw, 260px); }
  .art img, .art svg { width: 100%; height: auto; display: block; border-radius: 28px; }
  .artCaption { font-size: 1.9rem; font-weight: 800; color: var(--ink); }
  .art.pop { animation: artpop .35s ease; }
  @keyframes artpop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .art.pop { animation: none; } }
</style>
</head>
<body>
<div id="app">

  <section id="hub">
    <div class="topbar">
      <button id="backBtn" class="iconbtn" aria-label="กลับ">⬅</button>
    </div>
    <div id="bandStrip"></div>
    <div id="gameGrid"></div>

        <img id="art-img-nudge" alt="การ์ตูนให้กำลังใจ">

  <section id="chooser" hidden>

      <button id="chooserBackBtn" class="iconbtn" aria-label="กลับ">⬅</button>
    </div>
    <div id="chooserBody">
      <button id="soloBtn" class="chooseBtn"><span class="cIcon">🧒</span><span class="cLabel"></span></button>

</div>
<script src="../core.js"></script>
<script src="kids-data.js"></script>
<script src="kids-core.js"></script>

</body>
</html>
